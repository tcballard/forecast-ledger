<!doctype html><html lang="en"><meta charset="utf-8"><title>Forecast Ledger API contract checks</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto}button{padding:15px}pre{white-space:pre-wrap;line-height:1.8}</style><h1>Development API checks</h1><p>Checks ledger retrieval and rejects malformed writes without adding records.</p><button id="run">Run API checks</button><pre id="results" role="status">Not run</pre><script>
document.getElementById('run').onclick=async()=>{const lines=[];const log=s=>{lines.push(s);document.getElementById('results').textContent=lines.join('\n')};const eq=(a,b,msg)=>{if(a!==b)throw Error(msg+': '+a+' != '+b);log('PASS: '+msg)};try{const first=await fetch('/api/ledger');eq(first.status,200,'Ledger accessible');const d=await first.json();eq(d.forecasts.filter(f=>f.id.startsWith('baseline-')).length,5,'Five baseline records');const post=(path,p)=>fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let r=await post('/api/forecasts',{raceId:'2026-KS-S',probability:58,method:'QA',rationale:'Malformed forecast must never be committed.',evidence:[]});eq(r.status,400,'Out-of-range probability rejected by server');r=await post('/api/forecasts',{raceId:'2026-KS-S',probability:.58,method:'QA test',rationale:'Malformed forecast must never be committed.',evidence:[{title:'Bad URL',url:'javascript:alert(1)'}]});eq(r.status,400,'Unsafe source URL rejected by server');r=await post('/api/forecasts',{raceId:'2026-KS-S',probability:.58,method:'QA test',rationale:'Inconsistent model inputs must never be committed.',margin:1,sigma:5,evidence:[{title:'Example source',url:'https://example.com'}]});eq(r.status,400,'Inconsistent model probability rejected');r=await post('/api/outcomes',{raceId:'2026-KS-S',won:1,source:'https://example.com/result'});eq(r.status,409,'Premature outcome rejected');const after=await(await fetch('/api/ledger')).json();eq(after.forecasts.length,d.forecasts.length,'Invalid writes did not add forecasts');eq(after.outcomes.length,d.outcomes.length,'Invalid writes did not add outcomes');log('ALL 8 API CHECKS PASSED')}catch(e){log('FAIL: '+e.message)}};
</script></html>
